T2_confirmatory_freeze:
  required_frozen_objects:
    - "candidate inventory and exclusions"
    - "unit and dependence registry"
    - "measurement and semantic contract"
    - "qualification rules"
    - "model and baseline artifacts"
    - "parser and analysis code commit"
    - "software environment"
    - "random seeds"
    - "loss and estimands"
    - "uncertainty plan"
    - "output table shells"
    - "protocol deviation process"
  manifest_sha256_required: true
  external_trusted_timestamp_required: true
  outcome_must_remain_inaccessible: true
  timestamp_evidence_stack:
    primary: "OSF Registration"
    content_identity: "SHA-256 freeze manifest"
    secondary_code_evidence: "GitHub signed commit and immutable release"
    final_public_reproduction_DOI: "Zenodo"
  timestamp_receipt_path: "registration_external/0726_external_unlock_gate_completed_v1.json"
  circularity_control: >-
    The timestamp receipt and immediate pre-unlock attestation are external
    sidecar evidence generated only after the payload ZIP and freeze manifest
    exist. They are not embedded retroactively in the timestamped payload.
  external_unlock_gate_schema: "schemas/external_unlock_gate.schema.json"
  external_unlock_gate_template: "registration/0726_external_unlock_gate_template_v1.json"

outcome_lock:
  mechanism: >-
    PRINCIPAL_CUSTODIAN_FAIL_CLOSED_PARSER_AND_EXPLICIT_SINGLE_USE_UNLOCK:
    the principal researcher retains the original archives; before T3, the
    protocol-execution agent may invoke only frozen structural and
    covariate-qualification commands that reject or suppress ROP numeric
    output. Numeric ROP parsing becomes authorized only after the principal
    researcher issues an explicit single-use unlock instruction following
    completion of OSF Registration and the GitHub signed immutable release.
  physical_separation_required: false
  access_control_required: true
  numeric_ROP_payload_inaccessible_before_T3: true
  custodian_retains_original_archives: true
  preunlock_permitted_outputs:
    - "archive and member identity metadata"
    - "header mnemonics, descriptions and units"
    - "prespecified MD/WOB/surface-RPM/SPP QC summaries"
    - "hashes, access logs and qualification reason codes"
  preunlock_prohibited_outputs:
    - "ROP numeric values"
    - "ROP descriptive statistics or distributions"
    - "predictions, residuals or performance metrics"
    - "target-informed exclusions, transformations or thresholds"
  access_test_procedure: >-
    Run the frozen access-control dry-run suite against a synthetic archive
    containing a sentinel ROP curve and permitted covariates. Verify that T1a
    emits no numeric arrays, T1b emits only permitted covariate summaries, any
    explicit ROP-output request exits nonzero, the sentinel never appears in
    stdout/stderr/output files, and all attempted access is logged. Repeat the
    same command set against inventory metadata without invoking the numeric
    outcome parser.
  access_test_evidence_path: "registration/0725_outcome_lock_access_test_v1/0725_outcome_lock_access_test_report_v1.md"
  access_log_path: "registration/0725_outcome_lock_access_test_v1/0725_preunlock_access_test_log_v1.csv"
  access_test_manifest_path: "registration/0725_outcome_lock_access_test_v1/0725_outcome_lock_access_test_manifest_v1.json"
  access_test_manifest_sha256: "090867ED2ED6ACCFD85C6D1F04D83D55A22959EC701FEE28BB869285111FBAF2"
  access_test_status: "PASS_SYNTHETIC_SENTINEL"
  access_test_executed_at_utc: "2026-07-25T09:05:30.747198Z"
  real_Layer_D_archives_opened_by_access_test: false
  prohibited_ROP_request_exit_code: 17
  sentinel_found_in_permitted_outputs: false
  accepted_by_principal_researcher_at_utc: "2026-07-25T09:00:00Z"
  governance_decision_record: "registration/0725_outcome_custody_decision_v1.md"

T3_unlock:
  prerequisites:
    - "payload-ready checklist items F01 through F22 PASS"
    - "minimum qualified field and basin threshold met"
    - "trusted timestamp obtained"
    - "outcome still inaccessible immediately before authorized unlock"
  authorized_person_or_role: "principal researcher (user)"
  unlock_instruction_required: true
  unlock_instruction_form: "explicit written single-use authorization after all prerequisites PASS"
  unlock_datetime_utc: "NOT_YET_AUTHORIZED"
  execution_command: "python scripts/execute_frozen_run.py"
  single_frozen_execution: true
  stdout_path: "execution/0726_layer_d_frozen_run_v1/stdout.log"
  stderr_path: "execution/0726_layer_d_frozen_run_v1/stderr.log"
  raw_result_directory: "execution/0726_layer_d_frozen_run_v1"
  execution_environment_record: "registration/0726_execution_environment_lock_v1.json"
  execution_environment_hash_source: "SHA-256 entry in 16_freeze_manifest.json"
  frozen_scoring_source_map: "registration/0726_frozen_scoring_source_map_v1.csv"
  private_local_archive_locator: "registration_external/0726_local_archive_locator_completed_v1.json"
  private_locator_publication_prohibited: true
  private_locator_identity_rule: "SHA-256 recorded in the completed external unlock gate"
  fail_closed_rule: >-
    scripts/run_layer_d_confirmatory.py validates every external-gate boolean,
    Lu Yuhan's named authorization, the freeze-manifest SHA-256, and both
    external evidence URLs before opening any selected LAS member.

post_unlock:
  retain_all_unfavorable_results: true
  raw_results_immutable: true
  selective_field_rerun_prohibited: true
  protocol_deviation_log_required: true
  corrected_analysis_requires_full_cohort_rerun: true
  original_and_corrected_results_both_reported: true
  scientific_rule_change_status: "post_hoc_or_new_protocol_version"

custody_assertions:
  cohort_frozen: true
  analytical_freedom_frozen: true
  outcome_inaccessible_before_unlock: true
  execution_trace_complete: false
  assertion_scope_note: >-
    Cohort closure and preunlock outcome inaccessibility are evidenced,
    including a passing synthetic-sentinel access-control test. Analytical-
    freedom and execution-trace assertions remain false until all v1.0 checks
    pass and the frozen execution is completed.
