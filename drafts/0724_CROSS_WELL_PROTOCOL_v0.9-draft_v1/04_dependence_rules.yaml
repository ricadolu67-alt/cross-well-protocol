schema_version: "0.9"
status: "DRAFT_NOT_FROZEN"

hierarchy:
  - "provider"
  - "basin"
  - "field"
  - "well"
  - "wellbore"
  - "branch"
  - "dependence_family"

primary_definition:
  name: "conservative_traceable_related_well_family"
  rule: >-
    A dependence family groups a mother well, sidetracks or branches, shared
    wellhead identities, and any records shown by metadata, trajectory, or
    duplicate-data evidence to be non-independent.
  freeze_before_outcomes: true
  nominal_filename_is_sufficient_identity_evidence: false
  related_components_jointly_held_out: true
  component_scores_reported_separately: true
  related_components_do_not_increase_effective_outer_unit_count: true

evidence_sources:
  - "provider metadata"
  - "well and wellbore identifiers"
  - "branch or sidetrack identifiers"
  - "wellhead identity"
  - "trajectory overlap"
  - "duplicate or near-duplicate data audit"
  - "archive provenance"

primary_decision_order:
  - "explicit mother-well, sidetrack, or branch relationship"
  - "shared wellhead or traceable related-well identity"
  - "trajectory and duplicate-data evidence"
  - "unresolved identity is excluded under the frozen reason code"

sensitivity_definitions:
  separate_wellbores_where_defensible:
    role: "sensitivity_only"
    enabled: true
  higher_level_platform_or_campaign:
    role: "sensitivity_only_when_metadata_supports"
    enabled: true
    automatic_same_platform_grouping: false

audit_outputs:
  required_columns:
    - "archive_id"
    - "dependence_family_id"
    - "evidence_type"
    - "evidence_reference"
    - "decision"
    - "reviewer"
    - "decision_date"

known_retrospective_cases:
  - case_id: "F-7_F-9"
    role: "identified dependence case"
  - case_id: "F-15_F-15S"
    role: "identified dependence case"

