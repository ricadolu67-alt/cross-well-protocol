stopping_rule:
  type: "calendar_cutoff_plus_minimum_qualification"
  minimum_qualified_fields: 8
  minimum_basin_contexts: 4
  minimum_scorable_independent_families_per_primary_field: 2
  action_if_minimum_not_met_before_outcome_unlock: >-
    Do not unlock outcomes. Report that the planned confirmation threshold
    was not met and begin a separately versioned acquisition phase.
  action_if_minimum_not_met_after_unlock: >-
    Do not add archives or relax rules. Report the frozen cohort and its
    confirmatory limitation.

field_sampling:
  retain_all_eligible_families: true
  maximum_family_count_in_field_equal_weight: "not_applicable"
  acquisition_priority_rule: >-
    Search priority may be reduced after a field reaches approximately four
    to five qualified families, but no eligible acquired family may be removed.
  field_equal_final_weighting: true

candidate_processing_order:
  - "T0_acquisition_and_sha256"
  - "T1a_structural_qualification"
  - "dependence_family_construction"
  - "measurement_and_semantic_contract"
  - "T1b_label_blinded_covariate_qualification"
  - "final_qualified_cohort"
  - "T2_confirmatory_freeze"
  - "T3_numeric_outcome_unlock"

candidate_exclusion_policy:
  outcome_based_exclusion: false
  all_exclusions_must_use_prespecified_reason_code: true
  all_candidates_and_exclusions_retained_in_flow: true
  permitted_reason_codes:
    - "DUPLICATE_ARCHIVE"
    - "IDENTITY_UNRESOLVED"
    - "FIELD_OR_BASIN_UNRESOLVED"
    - "DEPENDENCE_UNRESOLVED"
    - "REQUIRED_FEATURE_ABSENT"
    - "TARGET_DEFINITION_INCOMPATIBLE"
    - "SEMANTIC_AMBIGUITY_EXCLUDE"
    - "COVARIATE_QC_FAIL"
    - "ARCHIVE_CORRUPT"
    - "OTHER_PRESPECIFIED"

minimum_confirmation_interpretation: >-
  Meeting the minimum field and basin counts is a procedural replication
  threshold, not a power calculation and not evidence of random-basin
  population inference.

